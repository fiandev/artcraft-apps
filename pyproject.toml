[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coprsync"
version = "0.1.0"
description = "Watch storytold release RPMs and republish them as Copr projects"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "copr>=2.1",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
coprsync = "coprsync.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
